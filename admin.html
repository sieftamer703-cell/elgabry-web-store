<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة مكتبة الجبري</title><link rel="stylesheet" href="admin.css"></head><body><header><h1>مكتبة الجبري <small>لوحة الإدارة</small></h1><button id="logout" hidden>تسجيل خروج</button></header><main><p id="message" role="status"></p><section id="loginPanel" class="panel"><h2>دخول المدير</h2><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button>دخول</button></form></section><section id="dashboard" hidden><div class="stats"><article>عدد المنتجات <strong id="productCount">0</strong></article><article>الطلبات <strong id="orderCount">0</strong></article></div><section class="panel"><h2 id="formTitle">إضافة منتج</h2><form id="productForm"><label>اسم المنتج<input id="name" required maxlength="150"></label><label>القسم<input id="category" required maxlength="80" placeholder="أدوات مدرسية"></label><label>السعر بالجنيه<input id="price" type="number" min="0" step="0.01" required></label><label>الكمية<input id="stock" type="number" min="0" step="1" required></label><label>رابط الصورة (اختياري)<input id="image_url" type="url" placeholder="https://..."></label><label>الوصف<textarea id="description"></textarea></label><label class="check"><input id="is_active" type="checkbox" checked> ظاهر للعملاء</label><button id="saveButton">حفظ المنتج</button><button id="cancelEdit" type="button" hidden>إلغاء التعديل</button></form></section><section class="panel"><h2>المنتجات</h2><div id="products"></div></section><section class="panel"><h2>الطلبات المسجلة</h2><p class="muted">الطلبات ستظهر بعد تنفيذ ربط إتمام الشراء داخل الموقع.</p><div id="orders"></div></section></section></main><script type="module" src="admin.js"></script></body></html>
